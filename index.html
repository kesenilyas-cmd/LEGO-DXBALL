<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lego Tuğla Oyunu</title>
<style>
html,body{margin:0;height:100%;background:#13236b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:absolute;display:block;touch-action:none}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;font-size:26px;background:#ffffffcc;border:0;border-radius:50%;width:46px;height:46px}
</style></head><body>
<canvas id="c"></canvas><button id="mute">🔊</button>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');cv.width=720;cv.height=1280;x.scale(2,2);
const W=360,H=640,PY=H-70,PH=16,F='"Arial Rounded MT Bold","Comic Sans MS",sans-serif';
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.left=(innerWidth-W*s)/2+'px';cv.style.top=(innerHeight-H*s)/2+'px'}
addEventListener('resize',fit);fit();
const C=['#e3342f','#ff8c1a','#ffd400','#2eb82e','#1e90ff','#8e44ad','#ff5fa2'];
const LV=[["........","00000000","11111111","22222222","33333333"],
["01010101","10101010","23232323","32323232","45454545"],
["...00...","..1111..",".222222.","33333333","44444444"],
[".00..00.","00000000","00000000",".000000.","..0000..","...00..."],
["..2222..",".222222.","22.22.22","22222222","2.2222.2",".2....2."]];
let st='menu',lv=0,lives=5,bricks=[],balls=[],pups=[],parts=[],px=W/2,pw=90,wideT=0,slowT=0,cnt=0,on=true,ac,voice=null,lastI=-1,tt=0;
const CN=['Red','Orange','Yellow','Green','Blue','Purple','Pink'];
const P=["Great job!","Good job, Bulut!","Wow! You are good!","Yay! Nice one!","Nice shot!","Good hit!","You are so fast!","You are so strong!","You are a star!","You are a Lego boss!","Smash the bricks!","Boom! Bricks go crash!","Look at the pretty colors!","I like the colors!","Keep going!","Do not stop!","Almost there!","Watch the ball!","Catch the ball!","Go, go, go!","High five!","That was fun!","Super!","Awesome!","Wow, so many bricks!","One more brick!","Yes! You can do it!","Very good!","Bulut loves his uncle too much!","Bulut is a champion!"];
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));voice=v.find(v=>/daniel|alex|david|guy|fred|aaron|arthur|male/i.test(v.name)&&!/female/i.test(v.name))||v[0]||null}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}
function say(t,force){if(!on||!window.speechSynthesis)return;if(!force&&speechSynthesis.speaking)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;u.pitch=.75;setTimeout(()=>speechSynthesis.speak(u),60)}
function cheer(){let i;do{i=Math.random()*P.length|0}while(i==lastI);lastI=i;say(P[i])}
function beep(f,d=.08){if(!on||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}
function load(){bricks=[];LV[lv%LV.length].forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!='.')bricks.push({x:20+i*40,y:80+j*24,c:+ch})}));reset()}
function reset(){balls=[{x:px,y:PY-8,vx:0,vy:0,r:7,on:1}];pups=[];wideT=slowT=0;pw=90;st='ready'}
const bs=()=>3+Math.min(lv,6)*.15;
function tap(){
 ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();
 if(st=='menu'){pickVoice();lv=0;lives=5;load();say("Hello Bulut! Let's play!",1)}
 else if(st=='ready'){const b=balls[0];b.on=0;b.vx=(Math.random()-.5)*1.6;b.vy=-bs();st='play';beep(600);say("Go, go, go!",1)}
 else if(st=='win'){lv++;load()}
 else if(st=='over'){lives=5;load()}
}
function mv(e){const r=cv.getBoundingClientRect();px=Math.max(pw/2,Math.min(W-pw/2,(e.clientX-r.left)/r.width*W))}
cv.addEventListener('pointermove',mv);cv.addEventListener('pointerdown',e=>{mv(e);tap()});
document.getElementById('mute').onclick=e=>{on=!on;e.target.textContent=on?'🔊':'🔇';if(!on)speechSynthesis.cancel()};
function burst(r){for(let i=0;i<7;i++)parts.push({x:r.x+20,y:r.y+11,vx:(Math.random()-.5)*5,vy:-Math.random()*3,c:C[r.c],l:30})}
function hit(r,i){bricks.splice(i,1);burst(r);beep(300+Math.random()*400);cnt++;if(cnt%4==0)cheer();else if(cnt%2==0)say(CN[r.c]+"!");
 if(Math.random()<.2)pups.push({x:r.x+20,y:r.y,t:Math.random()*3|0});
 if(!bricks.length){st='win';say("You did it! Great job!",1)}}
function step(dt){
 if(wideT>0){wideT-=dt/60;if(wideT<=0)pw=90}
 if(slowT>0)slowT-=dt/60;
 const sp=slowT>0?.65:1;
 for(const b of balls){if(b.on){b.x=px;b.y=PY-b.r-1;continue}
  for(let k=0;k<2;k++){
   b.x+=b.vx*sp*dt/2;b.y+=b.vy*sp*dt/2;
   if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
   if(b.vy>0&&b.y+b.r>=PY&&b.y-b.r<=PY+PH&&Math.abs(b.x-px)<pw/2+b.r){const a=(b.x-px)/(pw/2)*1.0,s=bs();b.vx=Math.sin(a)*s;b.vy=-Math.cos(a)*s;b.y=PY-b.r;beep(500,.05)}
   for(let i=bricks.length-1;i>=0;i--){const r=bricks[i],cx=Math.max(r.x,Math.min(b.x,r.x+40)),cy=Math.max(r.y,Math.min(b.y,r.y+22)),dx=b.x-cx,dy=b.y-cy;
    if(dx*dx+dy*dy<b.r*b.r){if(Math.abs(dx)>Math.abs(dy))b.vx=dx>0?Math.abs(b.vx):-Math.abs(b.vx);else b.vy=dy>0?Math.abs(b.vy):-Math.abs(b.vy);hit(r,i);break}}
  }}
 for(let i=pups.length-1;i>=0;i--){const p=pups[i];p.y+=1.8*dt;
  if(p.y>PY-10&&p.y<PY+PH+10&&Math.abs(p.x-px)<pw/2+12){pups.splice(i,1);beep(900,.15);
   if(p.t==0){pw=140;wideT=12}else if(p.t==1)slowT=10;else{const n=[];balls.forEach(b=>{if(!b.on&&balls.length+n.length<5)[-.6,.6].forEach(d=>n.push({x:b.x,y:b.y,vx:b.vx+d*2,vy:-Math.abs(b.vy),r:7}))});balls.push(...n)}
   say(['Big paddle!','Slow ball!','More balls!'][p.t],1)}
  else if(p.y>H)pups.splice(i,1)}
 balls=balls.filter(b=>b.y<H+20);
 if(!balls.length){lives--;if(lives<=0){st='over';say("Do not worry! Try again!",1)}else{reset();say("Oops! Try again!",1)}}
}
function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function brick(a,b,w,h,c,n){
 x.fillStyle=c;rr(a,b,w,h,4);x.fill();x.fillStyle='#ffffff55';x.fillRect(a+3,b+2,w-6,4);x.fillStyle='#00000030';x.fillRect(a+3,b+h-4,w-6,3);
 for(let i=0;i<n;i++){const s=a+w*(i+.5)/n;x.fillStyle=c;x.fillRect(s-6,b-3,12,4);x.beginPath();x.ellipse(s,b-3,6,2.6,0,0,7);x.fill();x.fillStyle='#ffffff55';x.beginPath();x.ellipse(s-1,b-3.5,3,1.1,0,0,7);x.fill()}}
function txt(t,y,sz,c='#fff'){x.font='bold '+sz+'px '+F;x.textAlign='center';x.lineWidth=5;x.strokeStyle='#13236b';x.strokeText(t,W/2,y);x.fillStyle=c;x.fillText(t,W/2,y)}
function draw(){
 tt++;const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b4fd8');g.addColorStop(1,'#6ec6ff');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.fillStyle='#ffffff18';for(let i=0;i<9;i++)for(let j=0;j<16;j++){x.beginPath();x.arc(20+i*40,20+j*40,9,0,7);x.fill()}
 bricks.forEach(r=>brick(r.x+1,r.y,38,22,C[r.c],2));
 pups.forEach(p=>{x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,13,0,7);x.fill();x.font='18px sans-serif';x.textAlign='center';x.fillText(['↔️','🐢','✨'][p.t],p.x,p.y+6)});
 brick(px-pw/2,PY,pw,PH,'#1e90ff',Math.round(pw/22));
 balls.forEach(b=>{x.fillStyle='#ffe14d';x.strokeStyle='#e08a00';x.lineWidth=2;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.stroke();x.fillStyle='#fff9';x.beginPath();x.arc(b.x-2,b.y-2,2.2,0,7);x.fill()});
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.2;if(--p.l<=0){parts.splice(i,1);continue}x.fillStyle=p.c;x.fillRect(p.x,p.y,6,6)}
 x.font='20px sans-serif';x.textAlign='left';x.fillText('❤️'.repeat(Math.max(lives,0)),10,30);
 if(st!='menu'){x.font='bold 16px '+F;x.textAlign='center';x.fillStyle='#fff';x.fillText('Seviye '+(lv+1),W/2,26)}
 const pul=1+Math.sin(tt/10)*.06;
 if(st=='menu'){txt('LEGO',230,64,'#ffd400');txt('TUĞLA KIRMA',290,38);txt('Başlamak için dokun!',400,24*pul)}
 if(st=='ready')txt('Topu fırlatmak için dokun!',380,20*pul);
 if(st=='win'){txt('HARİKA! 🎉',300,44,'#ffd400');txt('Sıradaki seviye için dokun',350,20*pul)}
 if(st=='over'){txt('Olsun, tekrar dene!',300,34,'#ffd400');txt('Dokun ve yeniden başla',350,20*pul)}
}
let lt=0;function loop(t){requestAnimationFrame(loop);const dt=Math.min(2,(t-lt)/16.67||1);lt=t;if(st=='play')step(dt);draw()}
requestAnimationFrame(loop);
</script></body></html>
